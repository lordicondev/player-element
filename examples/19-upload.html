<!doctype html>
<html lang="en">
    <head>
        <title>An icon from a file</title>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="./main.css" />
        <script type="module" src="/19-upload.ts"></script>
    </head>

    <body>
        <p><a href="/">Examples</a></p>
        <h1>An icon from a file</h1>
        <p>Pick a Lottie JSON file: the <code>icon</code> property shows it at once.</p>
        <div class="controls"><input type="file" accept=".json" /></div>
        <lord-icon id="icon" trigger="loop"></lord-icon>
    </body>
</html>
