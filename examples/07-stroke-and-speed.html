<!doctype html>
<html lang="en">
    <head>
        <title>Stroke and speed</title>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="./main.css" />
        <script type="module" src="/main.ts"></script>
    </head>

    <body>
        <p><a href="/">Examples</a></p>
        <h1>Stroke and speed</h1>
        <p>The width of the lines, and how fast the icon plays.</p>
        <div class="rows">
            <div class="row">
                <lord-icon trigger="loop" stroke="light" src="/icons/lock.json"></lord-icon>
                <div>
                    <pre>stroke="light"</pre>
                    <p>Thin lines.</p>
                </div>
            </div>
            <div class="row">
                <lord-icon trigger="loop" stroke="regular" src="/icons/lock.json"></lord-icon>
                <div>
                    <pre>stroke="regular"</pre>
                    <p>The usual width.</p>
                </div>
            </div>
            <div class="row">
                <lord-icon trigger="loop" stroke="bold" src="/icons/lock.json"></lord-icon>
                <div>
                    <pre>stroke="bold"</pre>
                    <p>Thick lines.</p>
                </div>
            </div>
            <div class="row">
                <lord-icon trigger="loop" speed="0.5" src="/icons/lock.json"></lord-icon>
                <div>
                    <pre>speed="0.5"</pre>
                    <p>Half the speed.</p>
                </div>
            </div>
            <div class="row">
                <lord-icon trigger="loop" speed="2" src="/icons/lock.json"></lord-icon>
                <div>
                    <pre>speed="2"</pre>
                    <p>Twice the speed.</p>
                </div>
            </div>
        </div>
    </body>
</html>
