<!doctype html>
<html lang="en">
    <head>
        <title>Background</title>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="./main.css" />
        <link rel="stylesheet" href="./08-background.css" />
        <script type="module" src="/main.ts"></script>
    </head>

    <body>
        <p><a href="/">Examples</a></p>
        <h1>Background</h1>
        <p>An icon behind content: it fills the box and loops.</p>
        <div class="box">
            <lord-icon trigger="loop(1500)" src="/icons/background.json"></lord-icon>
            <p>Text over an animated background.</p>
        </div>
        <pre>
.box { position: relative; }
.box lord-icon { position: absolute; inset: 0; z-index: -1; width: 100%; height: 100%; }</pre>
    </body>
</html>
